[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-uvix"
version = "1.0.0"
authors = [
  { name="Mauro Fanelli", email="maurofanellijr@gmail.com" },
  { name="JohnDaWalka", email="johndawalka@leaksnipe.win" }
]
description = "Solana Stack and UVIX-RI-1.0 Interoperability Protocol Bridge"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
sol-uvix = "sol_uvix.cli:main"
